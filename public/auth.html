<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizStructure — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1d9e75" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

<div class="auth-container">
  <a href="index.html" class="logo auth-logo">Biz<span>Structure</span></a>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
    </div>

    <!-- SIGN IN -->
    <div id="form-signin">
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Sign in to access your business analyses</p>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="signin-email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signin-password" placeholder="••••••••" />
      </div>
      <div id="signin-error" class="form-error hidden"></div>
      <button class="btn-form" id="signin-btn" onclick="signIn()">Sign in</button>
      <p class="auth-switch">No account? <a href="#" onclick="switchTab('signup')">Create one free</a></p>
    </div>

    <!-- SIGN UP -->
    <div id="form-signup" class="hidden">
      <h2 class="auth-title">Create your account</h2>
      <p class="auth-sub">Free to start. No credit card needed.</p>
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="signup-name" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="signup-email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min. 8 characters" />
      </div>
      <div id="signup-error" class="form-error hidden"></div>
      <div id="signup-success" class="form-success hidden"></div>
      <button class="btn-form" id="signup-btn" onclick="signUp()">Create account</button>
      <p class="auth-switch">Already have one? <a href="#" onclick="switchTab('signin')">Sign in</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  function switchTab(tab) {
    document.getElementById('form-signin').classList.toggle('hidden', tab !== 'signin');
    document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');
    document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  }

  async function signIn() {
    const email = document.getElementById('signin-email').value.trim();
    const password = document.getElementById('signin-password').value;
    const errEl = document.getElementById('signin-error');
    const btn = document.getElementById('signin-btn');
    errEl.classList.add('hidden');
    btn.textContent = 'Signing in...'; btn.disabled = true;

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = error.message; errEl.classList.remove('hidden');
      btn.textContent = 'Sign in'; btn.disabled = false;
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  async function signUp() {
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const errEl = document.getElementById('signup-error');
    const sucEl = document.getElementById('signup-success');
    const btn = document.getElementById('signup-btn');
    errEl.classList.add('hidden'); sucEl.classList.add('hidden');
    btn.textContent = 'Creating account...'; btn.disabled = true;

    const { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: name } } });
    if (error) {
      errEl.textContent = error.message; errEl.classList.remove('hidden');
      btn.textContent = 'Create account'; btn.disabled = false;
    } else {
      sucEl.textContent = 'Account created! Check your email to confirm, then sign in.';
      sucEl.classList.remove('hidden');
      btn.textContent = 'Create account'; btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const activeTab = document.getElementById('form-signup').classList.contains('hidden') ? 'signin' : 'signup';
      activeTab === 'signin' ? signIn() : signUp();
    }
  });
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js")
        .catch(err => console.warn("SW registration failed:", err));
    });
  }
</script>
</body>
</html>
